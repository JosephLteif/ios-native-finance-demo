name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Print build environment
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          swift --version
          xcode-select -p

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Inspect generated schemes
        run: xcodebuild -list -project ios-native-finance-demo.xcodeproj

      - name: Compile app and widget for a generic iOS device
        run: |
          set -o pipefail
          xcodebuild \
            -project ios-native-finance-demo.xcodeproj \
            -scheme FinanceDemo \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Compile watch app and complication for a generic watch simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project ios-native-finance-demo.xcodeproj \
            -target FinanceDemoWatch \
            -configuration Debug \
            -sdk watchsimulator \
            -destination "generic/platform=watchOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/WatchDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild-watch.log"

      - name: Compile unit tests for the iOS simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project ios-native-finance-demo.xcodeproj \
            -scheme FinanceDemo \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/TestDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build-for-testing 2>&1 | tee "$RUNNER_TEMP/xcodebuild-tests.log"

      - name: Run focused simulator tests
        run: |
          set -euo pipefail
          SIMULATOR_ID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ && $2 ~ /^[A-Fa-f0-9-]+$/ { print $2; exit }')"
          test -n "$SIMULATOR_ID" || { echo "No available iPhone simulator found"; exit 1; }
          xcodebuild \
            -project ios-native-finance-demo.xcodeproj \
            -scheme FinanceDemo \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/TestDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            test-without-building \
            -only-testing:FinanceDemoTests \
            -only-testing:FinanceDemoUITests 2>&1 | tee "$RUNNER_TEMP/xcodebuild-focused-tests.log"

      - name: Verify app and embedded widget
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/FinanceDemo.app"
          test -d "$APP_PATH" || { echo "Missing app: $APP_PATH"; exit 1; }
          test -d "$APP_PATH/PlugIns" || { echo "Missing PlugIns directory: $APP_PATH/PlugIns"; exit 1; }
          WATCH_APP_PATH="$APP_PATH/PlugIns/FinanceDemoWatch.app"
          test -d "$WATCH_APP_PATH" || { echo "Missing embedded watch app: $WATCH_APP_PATH"; exit 1; }
          test -d "$WATCH_APP_PATH/PlugIns/FinanceDemoWatchWidget.appex" || {
            echo "Missing embedded watch complication: $WATCH_APP_PATH/PlugIns/FinanceDemoWatchWidget.appex"
            exit 1
          }
          WIDGET_PATH=""
          for candidate in "$APP_PATH"/PlugIns/*.appex; do
            if [ -d "$candidate" ]; then
              WIDGET_PATH="$candidate"
              break
            fi
          done
          test -n "$WIDGET_PATH" || { echo "No WidgetKit .appex found in $APP_PATH/PlugIns"; exit 1; }
          test -f "$APP_PATH/Assets.car" || { echo "Missing compiled asset catalog: $APP_PATH/Assets.car"; exit 1; }
          DISPLAY_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP_PATH/Info.plist")"
          test "$DISPLAY_NAME" = "Pocket Ledger" || {
            echo "Unexpected app display name: $DISPLAY_NAME"
            exit 1
          }
          echo "App: $APP_PATH"
          echo "Watch app: $WATCH_APP_PATH"
          echo "Widget extension: $WIDGET_PATH"
          echo "Compiled app icon catalog: $APP_PATH/Assets.car"
          echo "Display name: $DISPLAY_NAME"
          file "$APP_PATH/FinanceDemo"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/FinanceDemo.app"
          PACKAGE_ROOT="$RUNNER_TEMP/unsigned-ipa"
          IPA_PATH="$GITHUB_WORKSPACE/FinanceDemo-unsigned.ipa"
          rm -rf "$PACKAGE_ROOT"
          rm -f "$IPA_PATH"
          mkdir -p "$PACKAGE_ROOT/Payload"
          ditto "$APP_PATH" "$PACKAGE_ROOT/Payload/FinanceDemo.app"
          ditto -c -k --sequesterRsrc --keepParent "$PACKAGE_ROOT/Payload" "$IPA_PATH"
          test -f "$IPA_PATH"
          unzip -t "$IPA_PATH"
          unzip -Z1 "$IPA_PATH" | grep -Eq '^Payload/FinanceDemo\.app/PlugIns/[^/]+\.appex(/|$)' || {
            echo "Packaged IPA does not contain an embedded widget extension."
            exit 1
          }
          unzip -Z1 "$IPA_PATH" | grep -Eq '^Payload/FinanceDemo\.app/PlugIns/FinanceDemoWatch\.app(/|$)' || {
            echo "Packaged IPA does not contain the embedded watch app."
            exit 1
          }
          unzip -l "$IPA_PATH"

      - name: Write build information
        run: |
          set -euo pipefail
          {
            echo "Xcode: $(xcodebuild -version | tr '\n' ' ')"
            echo "Swift: $(swift --version | head -n 1)"
            echo "Commit: $GITHUB_SHA"
            echo "Build date (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > build-info.txt
          cat build-info.txt

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: FinanceDemo-unsigned
          path: |
            FinanceDemo-unsigned.ipa
            build-info.txt
          retention-days: 7
